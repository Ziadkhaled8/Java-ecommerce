spring.application.name=dream-store
spring.main.banner-mode=off

server.port=9193

spring.datasource.url=jdbc:mysql: //localhost:3306/dream_shops_db
spring.datasource.username=username
spring.datasource.password=password
logging.level.web=DEBUG
logging.level.com.ecommerce.dreamstore=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-no-correlation-id}] %-5level %logger{36} - %msg%n

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
spring.jpa.hibernate.ddl-auto=update

app.image.upload-dir=uploads/images
# Maximum size allowed for a single uploaded file
spring.servlet.multipart.max-file-size=5MB

# Maximum size allowed for a total multipart/form-data request
spring.servlet.multipart.max-request-size=50MB

security.jwt.secret-key=9f2da6c43fdf44cc0225e0f85d47a1f89a8f811e1f2284c527aa6182ebf76cf4
# 1h in millisecond
security.jwt.expiration-time=3600000
# 7 days in millisecond
security.jwt.refresh-token.expiration-time=604800000

# Stripe Payment Gateway
stripe.api-key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.currency=USD
stripe.success-url=http://localhost:9193/api/payments/success?session_id={CHECKOUT_SESSION_ID}
stripe.cancel-url=http://localhost:9193/api/payments/cancel?order_id={ORDER_ID}

# Payment Circuit Breaker
payment.circuit-breaker.name=stripe-payment-cb
payment.circuit-breaker.failure-threshold=5
payment.circuit-breaker.reset-timeout-ms=30000
payment.circuit-breaker.half-open-success-threshold=2

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3

# SMTP Mail Configuration (defaults to local SMTP e.g. MailHog / Mailpit on 1025)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.from=${MAIL_FROM:no-reply@dreamstore.com}

# Transactional Outbox Configuration (Fallback Sweeper)
outbox.poller.fixed-delay-ms=30000
outbox.poller.batch-size=20
outbox.poller.max-retries=5

# Model Context Protocol (MCP) Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=dream-store-mcp-server
spring.ai.mcp.server.version=1.0.0





